name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Registry, repository and credentials all come from repo settings rather
# than being hardcoded, so re-pointing from artifactorycn to GHCR (or
# anywhere else) is a settings change, not a code change.
env:
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'artifactorycn.netcracker.com:17008' }}
  REPOSITORY: ${{ vars.IMAGE_REPOSITORY || 'product/prod.platform.databases_ghcall' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Pushing needs credentials, which forks and PRs from forks do not
      # have. Everything below is guarded on this so those still get a real
      # build — just not a publish.
      - name: Check for registry credentials
        id: creds
        run: echo "present=${{ secrets.REGISTRY_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.creds.outputs.present == 'true' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
