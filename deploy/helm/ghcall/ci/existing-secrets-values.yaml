# The documented production shape: credentials live in Secrets the chart
# does not own, and the agent is off until the detect-only output looks right.
github:
  existingSecret:
    name: ghcall-github
    key: token
database:
  existingSecret:
    name: ghcall-db
    key: dsn

config:
  filters:
    - name: ci-watch
      repos: [mchekalov/ghcall]
      state: open
      fields: [number, title, ci_status]
      watch_ci: true
