{{- /*
Only rendered when credentials are supplied inline. The documented path is
github.existingSecret / gitlab.existingSecret / database.existingSecret,
because values passed to --set are stored in Helm's release history in
plain text.
*/ -}}
{{- if include "ghcall.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ghcall.fullname" . }}-credentials
  labels:
    {{- include "ghcall.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.github.token }}
  token: {{ . | quote }}
  {{- end }}
  {{- with .Values.gitlab.token }}
  gitlab-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.database.dsn }}
  dsn: {{ . | quote }}
  {{- end }}
{{- end }}
