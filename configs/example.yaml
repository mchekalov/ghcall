github:
  token_env: GITHUB_TOKEN   # ghcall reads a PAT/App token from this env var

cache:
  driver: sqlite                  # sqlite (default) | postgres — see example-postgres.yaml
  path: ~/.cache/ghcall/cache.db  # sqlite driver only

concurrency:
  max_in_flight: 15         # bounded REST worker pool for phase-1 change detection

# Optional: the AI CI-autofix agent trigger. Absent/no image = disabled,
# ghcall behaves exactly as before (detect-and-print only). When set, ghcall
# runs one `docker run` of this image per PR any filter reports with a
# failing CI state (FAILURE/ERROR) — see ai-agent-component-design.md.
agent:
  image: artifactorycn.netcracker.com:17008/product/prod.platform.databases_ci-tools-autofix:master_latest
  docker_bin: docker              # override for podman, etc.
  max_concurrent_runs: 2          # each run is a heavy LLM+build job, unlike the cheap polling calls
  per_run_timeout_seconds: 1500   # 25 minutes
  env_passthrough:                # forwarded from ghcall's own process env into every container
    - AWS_BEARER_TOKEN_BEDROCK
    - ANTHROPIC_BEDROCK_BASE_URL
    - CLAUDE_CODE_USE_BEDROCK
    - CLAUDE_CODE_SKIP_BEDROCK_AUTH
    - ANTHROPIC_MODEL

filters:
  # Case 1: watch specific repos, only PRs from these authors, with CI status.
  - name: ci-watch
    repos:
      - mchekalov/sharepay
      - mchekalov/mchekalov.github.io
      - mchekalov/ghcall
    authors:
      - mchekalov
    state: open
    fields: [number, title, author, updated_at, ci_status]
    watch_ci: true

  # Case 2: scan specific repos, any author, just title + body.
  - name: repo-scan
    repos:
      - mchekalov/sharepay
      - mchekalov/mchekalov.github.io
      - mchekalov/ghcall
    state: all
    fields: [number, title, body]
